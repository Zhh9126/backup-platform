name: Publish Offline Image Bundle

# 由 GitHub 侧 runner 从已推送的 GHCR 版本镜像重新导出离线包，
# 并作为 Release 附件发布。使用内置 GITHUB_TOKEN，无需额外凭据。
# 触发：本文件变更推送到 main（发版轮），或在 Actions 页面手动指定版本重跑。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-offline.yml']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v）'
        required: true
        default: '2.3.10'

permissions:
  contents: write
  packages: read

jobs:
  bundle:
    name: 导出离线镜像包并上传 Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Setup variables
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${{ github.event.inputs.version || '2.3.10' }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published version image
        run: docker pull "ghcr.io/${REPO_LC}:v${VERSION}"

      - name: Tag all 4 RepoTags for the offline bundle
        run: |
          set -euo pipefail
          IMG="ghcr.io/${REPO_LC}:v${VERSION}"
          docker tag "$IMG" "ghcr.io/${REPO_LC}:latest"
          docker tag "$IMG" "aidbm:${VERSION}"
          docker tag "$IMG" "aidbm:latest"

      - name: Export gzip bundle and verify integrity
        run: |
          set -euo pipefail
          FILE="aidbm_${VERSION}_offline.tar.gz"
          docker save \
            "ghcr.io/${REPO_LC}:v${VERSION}" \
            "ghcr.io/${REPO_LC}:latest" \
            "aidbm:${VERSION}" \
            "aidbm:latest" | gzip > "$FILE"
          # gzip -t 是完整性唯一可信判据；失败即终止，不上传截断包
          gzip -t "$FILE"
          ls -lh "$FILE"

      - name: Publish as GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          FILE="aidbm_${VERSION}_offline.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "AIDBM ${TAG} 离线镜像包" \
              --notes "AIDBM ${TAG} 离线交付镜像包（含 4 个 RepoTag，可直接 docker load）。由本 workflow 从 GHCR 已发布镜像导出并校验 gzip 完整性；同源镜像地址 ghcr.io/${REPO_LC}:v${VERSION}。"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
