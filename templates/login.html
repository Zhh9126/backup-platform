<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 数据备份管理平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card card">
    <div class="login-brand">
      <i class="bi bi-hdd-network login-logo"></i>
      <div class="login-title">数据备份管理平台</div>
      <p class="login-sub">请登录以继续</p>
    </div>
    {% if error %}<div class="alert" style="background:var(--error-light);color:var(--error);border:none;border-radius:var(--radius-sm);padding:8px 12px;font-size:var(--font-size-sm);">登录失败：{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input class="form-control" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control" name="password" type="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">登录</button>
      <p class="text-muted mt-3 mb-0" style="font-size:var(--font-size-xs);">默认账号 admin / admin123，请在生产环境修改 SECRET_KEY 与密码。</p>
    </form>
  </div>
</body>
</html>
