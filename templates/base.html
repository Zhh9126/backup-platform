<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据备份管理平台</title>
  <link href="/static/css/bootstrap.min.css?v=2026080210" rel="stylesheet">
  <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css?v=2026081401" rel="stylesheet">
  <link href="/static/css/app.css?v=2026080207" rel="stylesheet">
</head>
<body data-page="{{ page }}">
  <div id="jsErrorBox" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;padding:8px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;max-height:200px;overflow:auto;"></div>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="brand">
        <i class="bi bi-hdd-network brand-logo"></i>
        <span class="brand-text">数据备份管理平台</span>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" title="收起 / 展开侧边栏" aria-label="收起或展开侧边栏">
          <i class="bi bi-list"></i>
        </button>
      </div>

<nav class="nav flex-column">
        <div class="nav-group-label">概览</div>
        <a class="nav-link {% if page=='dashboard' %}active{% endif %}" href="/" title="仪表盘"><i class="bi bi-speedometer2"></i> <span class="nav-label">仪表盘</span></a>
        <div class="nav-group-label">备份管理</div>
        <a class="nav-link {% if page=='tasks' %}active{% endif %}" href="/tasks" title="数据库备份"><i class="bi bi-list-check"></i> <span class="nav-label">数据库备份</span></a>
        <a class="nav-link {% if page=='file_backup' %}active{% endif %}" href="/file_backup" title="文件备份"><i class="bi bi-folder2-open"></i> <span class="nav-label">文件备份</span></a>
        <a class="nav-link {% if page=='storage' %}active{% endif %}" href="/storage" title="存储管理"><i class="bi bi-hdd-rack"></i> <span class="nav-label">存储管理</span></a>
        <a class="nav-link {% if page=='protection' %}active{% endif %}" href="/protection" title="备份策略"><i class="bi bi-shield-lock"></i> <span class="nav-label">备份策略</span></a>
        <a class="nav-link {% if page=='plugins' %}active{% endif %}" href="/plugins" title="备份依赖插件（一键安装 xtrabackup / percona / mariabackup 等）"><i class="bi bi-plug"></i> <span class="nav-label">备份插件</span></a>
        <a class="nav-link {% if page=='rt_timeline' %}active{% endif %}" href="/rt-timeline" title="实时备份（准 CDP）"><i class="bi bi-broadcast-pin"></i> <span class="nav-label">实时备份</span></a>
        <div class="nav-group-label">数据恢复管理</div>
        <a class="nav-link {% if page=='restore' %}active{% endif %}" href="/restore" title="数据恢复"><i class="bi bi-arrow-counterclockwise"></i> <span class="nav-label">数据恢复</span></a>
        <a class="nav-link {% if page=='restore-verify' %}active{% endif %}" href="/restore-verify" title="恢复校验"><i class="bi bi-patch-check"></i> <span class="nav-label">恢复校验</span></a>
        <a class="nav-link {% if page=='data-compare' %}active{% endif %}" href="/data-compare" title="数据对比（恢复数据 vs 生产库）"><i class="bi bi-clipboard-data"></i> <span class="nav-label">数据对比</span></a>
        <a class="nav-link {% if page=='deploy' %}active{% endif %}" href="/deploy" title="数据库部署"><i class="bi bi-rocket-takeoff"></i> <span class="nav-label">数据库部署</span></a>
        <div class="nav-group-label">记录</div>
        <a class="nav-link {% if page=='records' %}active{% endif %}" href="/records" title="备份记录"><i class="bi bi-archive"></i> <span class="nav-label">备份记录</span></a>
        <a class="nav-link {% if page=='restore_records' %}active{% endif %}" href="/restore_records" title="恢复记录"><i class="bi bi-clock-history"></i> <span class="nav-label">恢复记录</span></a>
        <div class="nav-group-label">灾备管理</div>
        <a class="nav-link {% if page=='migration' %}active{% endif %}" href="/migration" title="数据迁移"><i class="bi bi-arrow-repeat"></i> <span class="nav-label">数据迁移</span></a>
        <a class="nav-link {% if page=='sync' %}active{% endif %}" href="/sync" title="数据同步"><i class="bi bi-arrow-left-right"></i> <span class="nav-label">数据同步</span></a>
        <a class="nav-link {% if page=='dr-link' %}active{% endif %}" href="/dr-link" title="容灾链路"><i class="bi bi-diagram-3"></i> <span class="nav-label">容灾链路</span></a>
        <a class="nav-link {% if page=='clone' %}active{% endif %}" href="/clone" title="克隆服务"><i class="bi bi-layers"></i> <span class="nav-label">克隆服务</span></a>
        <div class="nav-group-label">运维</div>
        <a class="nav-link {% if page=='operations' %}active{% endif %}" href="/operations" title="运维运营分析（超长 / 超频备份统计与阈值配置）"><i class="bi bi-graph-up-arrow"></i> <span class="nav-label">运维运营分析</span></a>
        <a class="nav-link {% if page=='inspection' %}active{% endif %}" href="/inspection" title="巡检"><i class="bi bi-shield-check"></i> <span class="nav-label">巡检</span></a>
        <a class="nav-link {% if page=='agent' %}active{% endif %}" href="/agent" title="AI 智能助手"><i class="bi bi-robot"></i> <span class="nav-label">AI 智能助手</span></a>
        <a class="nav-link {% if page=='alert' %}active{% endif %}" href="/alert" title="智能告警"><i class="bi bi-bell"></i> <span class="nav-label">智能告警</span></a>
        <a class="nav-link {% if page=='datamining' %}active{% endif %}" href="/datamining" title="数据价值挖掘"><i class="bi bi-database-check"></i> <span class="nav-label">数据价值挖掘</span></a>
        <a class="nav-link {% if page=='logs' %}active{% endif %}" href="/logs" title="系统日志"><i class="bi bi-journal-text"></i> <span class="nav-label">系统日志</span></a>
        <a class="nav-link {% if page=='settings' %}active{% endif %}" href="/settings" title="系统设置"><i class="bi bi-gear"></i> <span class="nav-label">系统设置</span></a>
        <a class="nav-link logout" href="/logout" title="退出登录"><i class="bi bi-box-arrow-right"></i> <span class="nav-label">退出登录</span></a>
      </nav>
    </aside>
    <main class="content">
      <div class="content-inner">{% block content %}{% endblock %}</div>
    </main>
  </div>

  <!-- 通用二次确认弹窗（7.3） -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="confirmBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确认</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex"><div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>
  </div>

  <script src="/static/js/bootstrap.bundle.min.js?v=2026080210"></script>
  <script src="/static/js/bkp-core.js?v=2026080208"></script>
  <script src="/static/js/app.js?v=2026080208"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
