{% extends "base.html" %}
{% block content %}
<div class="toolbar">
  <div>
    <div class="page-title">数据同步</div>
    <div class="page-sub">纳管数据库并实时/定时将数据同步至目标库（无需安装 Agent）</div>
  </div>
  <button class="btn btn-primary" id="newSyncBtn"><i class="bi bi-plus-lg"></i> 新建同步任务</button>
</div>

<div class="page-card mb-3">
  <div class="table-responsive" style="flex:1">
    <table class="table table-hover align-middle mb-0">
      <thead><tr>
        <th>ID</th><th>名称</th><th>源</th><th>目标</th>
        <th>调度</th><th>状态</th><th>上次运行</th><th class="text-end">操作</th>
      </tr></thead>
      <tbody id="syncTaskTable"></tbody>
    </table>
  </div>
</div>

<div class="card-section-title"><i class="bi bi-arrow-repeat"></i> 最近同步记录</div>
<div class="page-card">
  <div class="table-responsive" style="flex:1">
    <table class="table table-hover align-middle mb-0">
      <thead><tr>
        <th>ID</th><th>同步任务</th><th>开始</th><th>结束</th>
        <th>状态</th><th>说明</th>
      </tr></thead>
      <tbody id="syncRecordTable"></tbody>
    </table>
  </div>
</div>

<!-- 同步任务模态框 -->
<div class="modal fade" id="syncModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="syncModalTitle">新建同步任务</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="syncForm">
          <input type="hidden" id="s_id">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label">同步任务名称 *</label>
              <input class="form-control" id="s_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">源类型 *</label>
              <select class="form-select" id="s_source_type">
                <option value="managed">托管数据库（引用已有备份任务）</option>
                <option value="manual">手动填写连接</option>
              </select>
            </div>
            <div class="col-md-6 s-managed-only">
              <label class="form-label">源（已纳管数据库）*</label>
              <select class="form-select" id="s_source_task_id"></select>
            </div>
            <div class="col-12 s-manual-only d-none">
              <div class="row g-3">
                <div class="col-md-4"><label class="form-label">源数据库类型</label>
                  <select class="form-select" id="s_src_db_type"></select></div>
                <div class="col-md-4"><label class="form-label">源主机</label>
                  <input class="form-control" id="s_src_host" placeholder="127.0.0.1"></div>
                <div class="col-md-4"><label class="form-label">源端口</label>
                  <input class="form-control" id="s_src_port" type="number"></div>
                <div class="col-md-4"><label class="form-label">源用户</label>
                  <input class="form-control" id="s_src_username"></div>
                <div class="col-md-4"><label class="form-label">源密码</label>
                  <input class="form-control" id="s_src_password" type="password"></div>
                <div class="col-md-4"><label class="form-label">源库/实例</label>
                  <input class="form-control" id="s_src_db_name"></div>
              </div>
            </div>
            <div class="col-12"><div class="card-section-title mb-2"><i class="bi bi-arrow-right"></i> 目标数据库</div></div>
            <div class="col-md-4"><label class="form-label">目标类型 *</label>
              <select class="form-select" id="s_tgt_db_type"></select></div>
            <div class="col-md-4"><label class="form-label">目标主机 *</label>
              <input class="form-control" id="s_tgt_host" placeholder="192.168.1.200"></div>
            <div class="col-md-4"><label class="form-label">目标端口</label>
              <input class="form-control" id="s_tgt_port" type="number"></div>
            <div class="col-md-4"><label class="form-label">目标用户</label>
              <input class="form-control" id="s_tgt_username"></div>
            <div class="col-md-4"><label class="form-label">目标密码</label>
              <input class="form-control" id="s_tgt_password" type="password"></div>
            <div class="col-md-4"><label class="form-label">目标库/实例</label>
              <input class="form-control" id="s_tgt_db_name"></div>
            <div class="col-md-6">
              <label class="form-label">调度方式</label>
              <select class="form-select" id="s_schedule_type">
                <option value="none">不自动（手动）</option>
                <option value="cron">Cron 表达式</option>
                <option value="interval">固定间隔</option>
              </select>
            </div>
            <div class="col-md-6 d-none" id="s_cron_wrap">
              <label class="form-label">Cron 表达式（分 时 日 月 周）</label>
              <input class="form-control" id="s_cron_expr" placeholder="0 2 * * *">
            </div>
            <div class="col-md-6 d-none" id="s_interval_wrap">
              <label class="form-label">间隔（分钟）</label>
              <input class="form-control" id="s_interval_minutes" type="number" value="60">
            </div>
            <div class="col-12">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="s_enabled" checked>
                <label class="form-check-label">启用</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" id="syncSaveBtn">保存</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
