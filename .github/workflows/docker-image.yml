name: Build & Publish Docker Image (GHCR)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本 tag：vX.Y.Z → X.Y.Z / X.Y.Z-<run_number> / latest / community
      # 用 GITHUB_RUN_NUMBER 区分同版本多次构建（稳定、无语法兼容风险），
      # 不再用 metadata-action 的 date 表达式。
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "all_tags=${IMAGE}:${VER},${IMAGE}:${VER}-r${GITHUB_RUN_NUMBER},${IMAGE}:latest,${IMAGE}:community" >> "$GITHUB_OUTPUT"
          echo "version_tag=${IMAGE}:${VER}" >> "$GITHUB_OUTPUT"
          echo "dated_tag=${IMAGE}:${VER}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.all_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Published:"
          echo "  ${{ steps.tags.outputs.version_tag }}"
          echo "  ${{ steps.tags.outputs.dated_tag }}"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:community"
