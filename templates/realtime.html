{% extends "base.html" %}
{% block title %}实时备份 · AIDBM{% endblock %}
{% block content %}
<!-- 实时备份（统一页面）：不再区分「PITR/准 CDP」与「CDC」两个标签页。
     同一条日志流产出两样东西——恢复点（可整库恢复到任意时刻）
     与行级变更（可下钻做精细化回滚/重放），所以合成一个页面按上下顺序呈现。 -->
{% include "_rt_panel.html" %}

<div class="d-flex align-items-center gap-2 my-4">
  <hr class="flex-grow-1 m-0">
  <span class="text-muted small px-2"><i class="bi bi-chevron-double-down"></i> 下钻：同一条日志里的行级变更</span>
  <hr class="flex-grow-1 m-0">
</div>

<div id="rtChangeDetail">
  {% include "_cdc_panel.html" %}
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/cdc.js?v=2026111404"></script>
<script>
  /* 兼容旧深链：?tab=cdc / ?cdp 不再切标签，改为滚动到「变更明细」区 */
  (function () {
    try {
      var t = new URLSearchParams(window.location.search).get('tab');
      if (t === 'cdc' || t === 'cdp') {
        var el = document.getElementById('rtChangeDetail');
        if (el) setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300);
      }
    } catch (e) { /* ignore */ }
  })();
</script>
{% endblock %}
