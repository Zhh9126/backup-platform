name: Build & Publish Docker Image (GHCR)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本 tag：vX.Y.Z → X.Y.Z / X.Y.Z-YYYYMMDD / latest / community
      # 日期与版本由本步骤显式计算（不用 metadata-action 的 date 表达式，
      # 避免不同 runner 时区/语法兼容问题）
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y%m%d)"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "version_tag=${IMAGE}:${VER}" >> "$GITHUB_OUTPUT"
          echo "dated_tag=${IMAGE}:${VER}-${DATE}" >> "$GITHUB_OUTPUT"
          echo "rolling_tags=${IMAGE}:latest,${IMAGE}:community" >> "$GITHUB_OUTPUT"
          echo "all_tags=${IMAGE}:${VER},${IMAGE}:${VER}-${DATE},${IMAGE}:latest,${IMAGE}:community" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.all_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Published:"
          echo "  ${{ steps.tags.outputs.version_tag }}"
          echo "  ${{ steps.tags.outputs.dated_tag }}"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:community"
