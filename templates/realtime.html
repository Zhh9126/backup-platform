{% extends "base.html" %}
{% block title %}实时备份（CDC / CDP） · AIDBM{% endblock %}
{% block content %}
<!-- 实时备份：把「准 CDP 恢复点时间轴（PITR）」与「CDC 行级变更捕获与回放」
     两套能力合成一个菜单入口，页面内以标签页切换。 -->
<ul class="nav nav-tabs mb-3" id="rtTabs" role="tablist">
  <li class="nav-item" role="presentation">
    <a class="nav-link active" id="tabRtBtn" data-bs-toggle="tab" href="#tabRt" role="tab" title="准 CDP：持续捕获恢复点，可恢复到时间轴任意时刻">
      <i class="bi bi-broadcast-pin"></i> PITR 时间轴（准 CDP）
    </a>
  </li>
  <li class="nav-item" role="presentation">
    <a class="nav-link" id="tabCdcBtn" data-bs-toggle="tab" href="#tabCdc" role="tab" title="CDC：行级变更捕获、事件查看、撤销回滚 / 重放到目标库">
      <i class="bi bi-broadcast"></i> CDC 变更捕获与回放
    </a>
  </li>
</ul>

<div class="tab-content" id="rtTabsContent">
  <div class="tab-pane fade show active" id="tabRt" role="tabpanel" aria-labelledby="tabRtBtn">
    {% include "_rt_panel.html" %}
  </div>
  <div class="tab-pane fade" id="tabCdc" role="tabpanel" aria-labelledby="tabCdcBtn">
    {% include "_cdc_panel.html" %}
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/cdc.js?v=2026111107"></script>
<script>
  /* ?tab=cdc 深链：旧的 /cdc 入口重定向到本页时直接切到 CDC 面板；?task_id= 由 app.js 的 PITR 深链逻辑处理 */
  (function () {
    try {
      var t = new URLSearchParams(window.location.search).get('tab');
      if (t === 'cdc' || t === 'cdp') {
        var el = document.getElementById('tabCdcBtn');
        if (el && window.bootstrap) bootstrap.Tab.getOrCreateInstance(el).show();
      }
    } catch (e) { /* ignore */ }
  })();
</script>
{% endblock %}
