name: Build & Publish Docker Image (GHCR)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（勾选后用 CI 精简上下文覆盖 GHCR 已有镜像，默认不覆盖）'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像仓库名全小写，而 GITHUB_REPOSITORY 可能含大写
      # （如 Zhh9126/backup-platform），必须先转小写，否则 buildx 报
      # "invalid tag: repository name must be lowercase"
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ghcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本 tag：vX.Y.Z[ -rerunN ] → vX.Y.Z / X.Y.Z / X.Y.Z-r<run_number> / latest / community
      # rerunN 只用于重新触发发布，不进入镜像版本；保留 v 前缀对齐离线包 workflow 与文档。
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          RAW_VER="${GITHUB_REF_NAME#v}"
          VER="${RAW_VER%%-rerun*}"
          IMAGE="${{ steps.image.outputs.name }}"
          echo "all_tags=${IMAGE}:v${VER},${IMAGE}:${VER},${IMAGE}:${VER}-r${GITHUB_RUN_NUMBER},${IMAGE}:latest,${IMAGE}:community" >> "$GITHUB_OUTPUT"
          echo "version_tag=${IMAGE}:v${VER}" >> "$GITHUB_OUTPUT"
          echo "dated_tag=${IMAGE}:${VER}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      # 完整性守卫（2026-11-13）：本机发布时会用 scripts/docker_prep_tools.sh 产出
      # 的 .docker-bake 烘焙 MySQL 客户端族 / XtraBackup / MariaDB Backup 等工具层，
      # 再手动推到 GHCR；而 CI 上下文不含 .docker-bake（.dockerignore 排除），
      # 构建出的同名 tag 是“精简镜像”。若 CI 无条件重建，会把本机推的完整镜像覆盖掉，
      # 用户 docker pull 就少工具。因此：GHCR 已存在该版本 tag 时默认跳过构建。
      # 确实需要 CI 重建时，用 workflow_dispatch 勾选 force。
      - name: Integrity guard (skip if already published)
        id: guard
        run: |
          set -uo pipefail
          IMAGE="${{ steps.image.outputs.name }}"
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-rerun*}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" != "true" ] && docker manifest inspect "${IMAGE}:v${VER}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GHCR 已存在 ${IMAGE}:v${VER}（视作本机完整镜像），跳过 CI 重建以免覆盖"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.all_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Published:"
          echo "  ${{ steps.tags.outputs.version_tag }}"
          echo "  ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          echo "  ${{ steps.tags.outputs.dated_tag }}"
          echo "  ${{ steps.image.outputs.name }}:latest"
          echo "  ${{ steps.image.outputs.name }}:community"
